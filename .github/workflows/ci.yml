name: "CI & Security Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Typecheck, Build, Security Audit & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck & Static Analysis
      run: npm run lint

    - name: Run Security & Regression Tests
      run: npm test

    - name: Dependency Vulnerability Audit
      run: npm audit --audit-level=high

    - name: Production Application Build
      run: npm run build
