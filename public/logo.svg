<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D3CFF"/>
      <stop offset="45%" stop-color="#B54DDB"/>
      <stop offset="100%" stop-color="#FFB000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC21A"/>
      <stop offset="55%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#F47B00"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#1D2733"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- transparent background -->
  <circle cx="500" cy="500" r="435" fill="white"/>
  <circle cx="500" cy="500" r="435" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <!-- subtle inner glow -->
  <circle cx="500" cy="500" r="405" fill="#fff" opacity="0.96"/>
  <!-- P / D-like upper monogram -->
  <path fill="url(#dark)" d="
    M280 760 L280 235
    Q280 190 325 190
    L555 190
    Q735 190 735 365
    Q735 475 655 535
    Q615 565 555 580
    L555 465
    Q610 450 610 365
    Q610 315 555 315
    L405 315
    L405 760 Z"/>
  <!-- analytics bars -->
  <rect x="355" y="495" width="58" height="185" rx="10" fill="url(#gold)"/>
  <rect x="430" y="430" width="58" height="250" rx="10" fill="url(#gold)"/>
  <rect x="505" y="355" width="58" height="325" rx="10" fill="url(#gold)"/>
  <!-- lower B -->
  <path fill="url(#gold)" d="
    M455 625
    L590 545
    Q690 485 760 430
    Q805 395 820 350
    Q850 420 815 485
    Q790 535 730 575
    Q805 600 820 675
    Q840 755 775 810
    Q735 845 660 845
    L455 845 Z
    M580 700 L580 755 L665 755
    Q705 755 705 725
    Q705 700 665 700 Z"/>
  <!-- white separation swoosh -->
  <path d="M300 805 Q470 625 735 470" fill="none" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- gold growth ribbon -->
  <path d="M300 805 Q475 625 735 470" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <!-- clean white highlight inside ribbon -->
  <path d="M330 780 Q485 625 715 495" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity=".9"/>
</svg>
