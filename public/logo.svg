<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient: Purple to Amber/Gold -->
    <linearGradient id="pbitianRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Golden B & Bar Chart Gradient -->
    <linearGradient id="pbitianGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Dark Charcoal P Gradient -->
    <linearGradient id="pbitianDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <filter id="pbitianGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background White Circle -->
  <circle cx="250" cy="250" r="238" fill="#FFFFFF" />

  <!-- Outer Gradient Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#pbitianRingGrad)" stroke-width="12" />

  <!-- Main PB Monogram Icon Group -->
  <g transform="translate(100, 75)" filter="url(#pbitianGlow)">
    <!-- Black P Structure -->
    <path d="M 35,25 L 145,25 C 195,25 225,55 225,105 C 225,155 195,185 145,185 L 85,185 L 85,295 C 65,285 45,268 35,250 Z" fill="url(#pbitianDarkGrad)" />
    <!-- P Inner Cutout (White) -->
    <path d="M 85,70 L 140,70 C 162,70 175,83 175,105 C 175,127 162,140 140,140 L 85,140 Z" fill="#FFFFFF" />

    <!-- Bar Chart Pillars rising in the junction -->
    <rect x="110" y="125" width="16" height="55" rx="3" fill="url(#pbitianGoldGrad)" />
    <rect x="134" y="105" width="16" height="75" rx="3" fill="url(#pbitianGoldGrad)" />
    <rect x="158" y="80" width="16" height="100" rx="3" fill="url(#pbitianGoldGrad)" />

    <!-- Golden B Swoosh and Loop Structure -->
    <path d="M 28,290 C 85,240 165,180 260,140 C 245,200 235,220 225,235 C 210,215 190,200 165,200 L 135,200 L 135,290 L 205,290 C 250,290 275,260 275,225 C 275,185 245,160 215,150 C 270,110 305,160 300,225 C 295,285 250,325 190,325 L 120,325 Z" fill="url(#pbitianGoldGrad)" />
  </g>
</svg>
