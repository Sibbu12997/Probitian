<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFD" />
      <stop offset="70%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Logo Outer Ring Gradient -->
    <linearGradient id="logoRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Gold Gradient for BI & B -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />

  <!-- Background Grid Dots Top-Left -->
  <g fill="#8B5CF6" opacity="0.35" transform="translate(80, 80)">
    <circle cx="0" cy="0" r="3" /><circle cx="16" cy="0" r="3" /><circle cx="32" cy="0" r="3" />
    <circle cx="0" cy="16" r="3" /><circle cx="16" cy="16" r="3" /><circle cx="32" cy="16" r="3" />
  </g>

  <!-- Background Grid Dots Top-Right -->
  <g fill="#F59E0B" opacity="0.45" transform="translate(1060, 80)">
    <circle cx="0" cy="0" r="3" /><circle cx="16" cy="0" r="3" /><circle cx="32" cy="0" r="3" />
    <circle cx="0" cy="16" r="3" /><circle cx="16" cy="16" r="3" /><circle cx="32" cy="16" r="3" />
  </g>

  <!-- Bottom Left Wave Curves -->
  <path d="M -50 480 C 150 420 200 360 100 280 C 0 200 -50 350 -100 480 Z" fill="#8B5CF6" opacity="0.08" />
  <path d="M -50 500 C 250 440 320 380 180 300 C 100 250 -20 400 -50 500 Z" fill="#C084FC" opacity="0.12" />

  <!-- Right Side Rising Line Graph & Bars -->
  <g transform="translate(900, 200)">
    <rect x="0" y="160" width="22" height="100" rx="4" fill="#8B5CF6" opacity="0.12" />
    <rect x="35" y="120" width="22" height="140" rx="4" fill="#8B5CF6" opacity="0.18" />
    <rect x="70" y="80" width="22" height="180" rx="4" fill="#8B5CF6" opacity="0.25" />
    <rect x="105" y="40" width="22" height="220" rx="4" fill="#8B5CF6" opacity="0.32" />
    <rect x="140" y="0" width="22" height="260" rx="4" fill="#8B5CF6" opacity="0.45" />

    <!-- Trend Line -->
    <path d="M -20 220 L 15 170 L 50 130 L 85 90 L 120 50 L 155 10" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" />
    <circle cx="-20" cy="220" r="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="15" cy="170" r="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="50" cy="130" r="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="85" cy="90" r="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="120" cy="50" r="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="155" cy="10" r="8" fill="#8B5CF6" />
  </g>

  <!-- Center Content Block -->
  <g transform="translate(240, 100)" filter="url(#shadow)">
    <!-- Logo Badge Circle -->
    <g transform="translate(0, 0)">
      <circle cx="90" cy="90" r="88" fill="#FFFFFF" />
      <circle cx="90" cy="90" r="86" fill="none" stroke="url(#logoRing)" stroke-width="5" />
      <!-- Logo Monogram -->
      <g transform="translate(42, 32) scale(0.35)">
        <path d="M 35,25 L 145,25 C 195,25 225,55 225,105 C 225,155 195,185 145,185 L 85,185 L 85,295 Z" fill="#111827" />
        <path d="M 85,70 L 140,70 C 162,70 175,83 175,105 C 175,127 162,140 140,140 L 85,140 Z" fill="#FFFFFF" />
        <rect x="110" y="125" width="16" height="55" rx="3" fill="url(#goldTextGrad)" />
        <rect x="134" y="105" width="16" height="75" rx="3" fill="url(#goldTextGrad)" />
        <rect x="158" y="80" width="16" height="100" rx="3" fill="url(#goldTextGrad)" />
        <path d="M 28,290 C 85,240 165,180 260,140 C 245,200 235,220 225,235 C 210,215 190,200 165,200 L 135,200 L 135,290 L 205,290 C 250,290 275,260 275,225 C 275,185 245,160 215,150 C 270,110 305,160 300,225 C 295,285 250,325 190,325 L 120,325 Z" fill="url(#goldTextGrad)" />
      </g>
    </g>

    <!-- Vertical Separator Line -->
    <line x1="220" y1="40" x2="220" y2="140" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

    <!-- Brand Typography Header -->
    <g transform="translate(250, 45)">
      <!-- ProBItian Title -->
      <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" letter-spacing="-1">
        <tspan fill="#111827">Pro</tspan><tspan fill="url(#goldTextGrad)">BI</tspan><tspan fill="#111827">tian</tspan>
      </text>

      <!-- Subtitle Tagline -->
      <g transform="translate(0, 48)">
        <line x1="0" y1="-5" x2="35" y2="-5" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" />
        <text x="48" y="0" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="16" fill="#111827" letter-spacing="4">
          MASTER BUSINESS INTELLIGENCE
        </text>
        <line x1="420" y1="-5" x2="455" y2="-5" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Bottom Tech Stack Row -->
  <g transform="translate(210, 340)">
    <!-- POWER BI -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="12" height="24" rx="2" fill="#F59E0B" />
      <rect x="16" y="-6" width="12" height="30" rx="2" fill="#FACC15" />
      <text x="36" y="16" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#111827">POWER BI</text>
    </g>

    <line x1="130" y1="-5" x2="130" y2="25" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- MICROSOFT FABRIC -->
    <g transform="translate(150, 0)">
      <path d="M 0 18 Q 8 0 18 6 Q 26 12 24 24" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
      <text x="32" y="16" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#111827">MICROSOFT FABRIC</text>
    </g>

    <line x1="310" y1="-5" x2="310" y2="25" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- SQL -->
    <g transform="translate(330, 0)">
      <ellipse cx="12" cy="4" rx="10" ry="4" fill="#8B5CF6" />
      <path d="M 2 4 L 2 18 C 2 22 22 22 22 18 L 22 4" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
      <text x="30" y="16" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#111827">SQL</text>
    </g>

    <line x1="390" y1="-5" x2="390" y2="25" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- DAX -->
    <g transform="translate(410, 0)">
      <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#8B5CF6">DAX</text>
    </g>

    <line x1="470" y1="-5" x2="470" y2="25" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- POWER QUERY -->
    <g transform="translate(490, 0)">
      <rect x="0" y="0" width="20" height="20" rx="3" fill="none" stroke="#8B5CF6" stroke-width="2" />
      <line x1="0" y1="7" x2="20" y2="7" stroke="#8B5CF6" stroke-width="1.5" />
      <line x1="7" y1="0" x2="7" y2="20" stroke="#8B5CF6" stroke-width="1.5" />
      <text x="28" y="12" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#111827">POWER</text>
      <text x="28" y="22" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#111827">QUERY</text>
    </g>

    <line x1="575" y1="-5" x2="575" y2="25" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- AI & ANALYTICS -->
    <g transform="translate(595, 0)">
      <circle cx="10" cy="10" r="8" fill="#F59E0B" />
      <text x="26" y="16" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#111827">AI &amp; ANALYTICS</text>
    </g>
  </g>
</svg>
